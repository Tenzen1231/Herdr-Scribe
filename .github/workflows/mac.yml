name: macOS

on:
  push:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install from this checkout
        run: bash mac/install.sh --no-launch

      - name: Transcribe synthetic Russian speech with the installed app
        run: |
          ~/Applications/HerdrScribe.app/Contents/MacOS/HerdrScribe --diagnose \
            "$PWD/mac/tests/speech-ru.wav" "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json"
          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          assert 'голосового ввода' in result['text'].lower(), result
          assert result['lines'] == 2, result  # 40 s of silence splits the two phrases
          assert '[00:00:49]' in result['text'], result
          assert result['menu_items'] > 5, result
          assert result['captured'] == 1600, result  # format of a captured buffer is readable
          PY

  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s core/tests
